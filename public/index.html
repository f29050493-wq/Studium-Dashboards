<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Container / Navigation -->
  <div class="app-layout">
    <header class="top-header">
      <div class="brand">
        <div class="brand-accent"></div>
        <h1>Workspace</h1>
        <span id="telemetry-time" class="time-badge">00:00:00</span>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" data-target="view-dashboard-studium">
          <span class="nav-icon">📅</span> Dashboard & Studium
        </button>
        <button class="nav-btn" data-target="view-selfcare-projects">
          <span class="nav-icon">✨</span> Self-Care & Projekte
        </button>
      </nav>
    </header>

    <main class="main-content">

      <!-- SEITE 1: DASHBOARD & STUDIUM -->
      <section id="view-dashboard-studium" class="dashboard-view active">
        
        <div class="two-column-layout">
          <!-- Linke Spalte: Control Center -->
          <div class="side-panel">
            
            <!-- 1. Kurs hinzufügen -->
            <div class="card glass-card">
              <div class="card-header">
                <h3>Neuer Kurs</h3>
              </div>
              <form id="add-course-form" class="vertical-form">
                <div class="form-group">
                  <input type="text" id="course-title" placeholder="Kursname (z.B. Regelungstechnik)" required />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <input type="text" id="course-type" placeholder="Art (z.B. VL, Labor)" />
                  </div>
                  <div class="form-group">
                    <select id="course-day">
                      <option value="1">Montag</option>
                      <option value="2">Dienstag</option>
                      <option value="3">Mittwoch</option>
                      <option value="4">Donnerstag</option>
                      <option value="5">Freitag</option>
                    </select>
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="input-label">Start</label>
                    <input type="time" id="course-start" value="08:00" required />
                  </div>
                  <div class="form-group">
                    <label class="input-label">Ende</label>
                    <input type="time" id="course-end" value="09:30" required />
                  </div>
                  <div class="form-group color-picker-group">
                    <label class="input-label">Farbe</label>
                    <input type="color" id="course-color" value="#00897b" />
                  </div>
                </div>
                <button type="submit" class="btn-primary btn-block">+ Kurs eintragen</button>
              </form>
            </div>

            <!-- 2. Habits Widget -->
            <div class="card glass-card">
              <h3>Habits</h3>
              <form id="add-habit-form" class="inline-form">
                <input type="text" id="habit-name" placeholder="Neues Habit..." required>
                <button type="submit" class="btn-primary">+</button>
              </form>
              <div id="habits-container" class="item-list"></div>
            </div>

            <!-- 3. Termine Widget -->
            <div class="card glass-card">
              <h3>Termine</h3>
              <form id="add-appointment-form" class="inline-form">
                <input type="text" id="app-title" placeholder="Termin..." required>
                <input type="date" id="app-date" required>
                <button type="submit" class="btn-primary">+</button>
              </form>
              <div id="appointments-list" class="item-list"></div>
            </div>

            <!-- 4. Kursliste Widget -->
            <div class="card glass-card">
              <h3>Eingetragene Kurse</h3>
              <div id="courses-list" class="item-list"></div>
            </div>

          </div>

          <!-- Rechte Spalte: Stundenplan Kalender -->
          <div class="main-panel">
            <div class="card glass-card calendar-wrapper">
              <div id="calendar"></div>
            </div>
          </div>
        </div>

      </section>

      <!-- SEITE 2: SELF-CARE & PROJEKTE -->
      <section id="view-selfcare-projects" class="dashboard-view">
        
        <!-- Tracker Header & Selector -->
        <div class="card glass-card tracker-bar">
          <div class="tracker-select-wrapper">
            <span class="section-badge">Pixel-Tracker</span>
            <select id="tracker-type-select">
              <option value="mood">Mood & Energy Flow</option>
              <option value="weather">Weather & Seasons</option>
              <option value="health">Health & Body Mind</option>
              <option value="focus">Productivity & Focus</option>
              <option value="sleep">Sleep & Rest</option>
              <option value="movement">Movement & Fitness</option>
              <option value="connection">Social & Connection</option>
              <option value="nourishment">Nourishment & Water</option>
            </select>
          </div>
          <div id="tracker-legend-display" class="legend-container"></div>
        </div>

        <!-- Tracker Grid Card -->
        <div class="card glass-card relative-container">
          <div id="interactive-tracker-container"></div>
          <div id="tracker-popup-menu" class="popup-menu hidden"></div>
        </div>

        <!-- Dreier-Raster: Bücher, Bingo & Projekte -->
        <div class="grid-three">
          
          <!-- Bücherregal -->
          <div class="card glass-card">
            <h3>Bücherregal</h3>
            <p class="subtext">Klicke auf ein Buch zum Bearbeiten.</p>
            <div id="bookshelf-container" class="bookshelf-grid"></div>
          </div>

          <!-- Bingo Grid -->
          <div class="card glass-card">
            <h3>Self-Care Bingo</h3>
            <div id="bingo-grid" class="bingo-container"></div>
          </div>

          <!-- Projekte -->
          <div class="card glass-card">
            <div class="card-header-flex">
              <h3>Projekte</h3>
              <button id="add-project-btn" class="btn-primary-sm">+ Neu</button>
            </div>
            <div id="project-list" class="project-container"></div>
          </div>

        </div>

      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/de.js"></script>
  <script src="app.js"></script>
</body>
</html>
